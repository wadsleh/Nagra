<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة الإدارة | نَقْرَة</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; background: #0f2027; color: white; padding: 20px; direction: rtl; margin: 0; }
        .card { background: white; color: #2c3e50; padding: 25px; border-radius: 20px; margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .item-row { background: #f8f9fa; padding: 15px; border-radius: 15px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; border-right: 5px solid #11998e; flex-wrap: wrap; gap: 10px; border: 1px solid #eee; border-right-width: 5px; }
        .btn { padding: 10px 15px; border: none; border-radius: 10px; cursor: pointer; color: white; font-weight: bold; font-family: 'Tajawal'; transition: 0.3s; font-size: 14px; }
        .btn-green { background: #2ecc71; } .btn-blue { background: #3498db; } .btn-red { background: #e74c3c; }
        .btn:hover { opacity: 0.9; transform: translateY(-2px); box-shadow: 0 4px 10px rgba(0,0,0,0.15); }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); backdrop-filter: blur(5px); display: none; justify-content: center; align-items: center; z-index: 2000; }
        .modal-box { background: white; color: #2c3e50; padding: 30px 20px; border-radius: 25px; text-align: center; width: 85%; max-width: 320px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); animation: popIn 0.3s ease-out; }
        @keyframes popIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        
        /* تنسيق مربع إدخال الكود الجديد */
        #admin-reply-input { width: 100%; padding: 12px; margin-bottom: 15px; border: 2px solid #eee; border-radius: 10px; font-family: 'Tajawal'; display: none; box-sizing: border-box; }
        #admin-reply-input:focus { border-color: #3498db; outline: none; }

        .toast { visibility: hidden; min-width: 250px; background: #11998e; color: white; text-align: center; border-radius: 50px; padding: 15px; position: fixed; z-index: 3000; left: 50%; bottom: 30px; transform: translateX(-50%); transition: 0.3s; font-weight: bold; box-shadow: 0 10px 20px rgba(0,0,0,0.2); }
        .toast.error { background: #e74c3c; } .toast.show { visibility: visible; bottom: 50px; }
    </style>
</head>
<body style="display: none;" id="admin-body"> <h1 style="text-align:center; color:#11998e; margin-top: 10px;">غرفة تحكم نَقْرَة ⚙️</h1>
    
    <div style="text-align: left; margin-bottom: 15px;">
        <button onclick="logoutAdmin()" class="btn btn-red">تسجيل خروج</button>
    </div>

    <div class="card">
        <h3 style="border-bottom: 2px solid #eee; padding-bottom: 15px; margin-top: 0;">📦 الطلبات الواردة</h3>
        <div id="orders-container"><p style="text-align:center; color: #7f8c8d;">جاري جلب الطلبات... ⏳</p></div>
    </div>

    <div id="confirm-modal" class="modal-overlay">
        <div class="modal-box">
            <div style="font-size: 45px; margin-bottom: 10px;">⚠️</div>
            <h3 id="modal-title-text" style="margin: 0 0 10px; color: #2c3e50;">تأكيد</h3>
            <p id="modal-msg" style="color: #7f8c8d; font-size: 14px; margin-bottom: 20px; line-height: 1.6;"></p>
            
            <input type="text" id="admin-reply-input" placeholder="أدخل كود البطاقة أو الرد للزبون هنا...">
            
            <div style="display: flex; gap: 10px;">
                <button id="btn-confirm" class="btn btn-green" style="flex:1; padding: 12px; font-size: 15px;">نعم، تأكيد</button>
                <button onclick="closeConfirm()" class="btn" style="flex:1; background: #f1f2f6; color: #576574; padding: 12px; font-size: 15px;">إلغاء</button>
            </div>
        </div>
    </div>

    <div id="toast-message" class="toast"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, doc, updateDoc, getDoc } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js"; // استدعاء أدوات الحماية
        
        const firebaseConfig = { apiKey: "AIzaSyB_8sjnJNMpUi0LAQv7U5lFmMvRlh5x0nU", authDomain: "nagra-app.firebaseapp.com", projectId: "nagra-app", storageBucket: "nagra-app.firebasestorage.app", messagingSenderId: "29893867141", appId: "1:29893867141:web:e8b4e0a15d80898575dbec" };
        const app = initializeApp(firebaseConfig); 
        const db = getFirestore(app);
        const auth = getAuth(app);

        // ⚠️ ضع إيميلك الشخصي هنا (الإيميل الوحيد المسموح له بدخول لوحة التحكم)
        const ADMIN_EMAIL = "wadsalihhamed@gmail.com"; 

        // حماية الصفحة: طرد أي شخص غير الإدمن
        onAuthStateChanged(auth, (user) => {
            if (user && user.email === ADMIN_EMAIL) {
                document.getElementById('admin-body').style.display = 'block'; // إظهار اللوحة للإدمن
            } else {
                window.location.href = "index.html"; // طرد أي شخص آخر للتطبيق الرئيسي
            }
        });

        window.logoutAdmin = async () => { await signOut(auth); window.location.href = "index.html"; };

        window.showToast = (msg, isError = false) => { 
            const t = document.getElementById('toast-message'); t.innerText = msg; 
            t.className = isError ? "toast error show" : "toast show"; 
            setTimeout(() => t.className = "toast", 3000); 
        };
        
        let pending = null; 
        
        window.closeConfirm = () => {
            document.getElementById('confirm-modal').style.display = 'none'; 
            document.getElementById('admin-reply-input').style.display = 'none'; // إخفاء المربع عند الإغلاق
            document.getElementById('admin-reply-input').value = '';
        };

        window.openConfirm = (t, m, showInput, f) => { 
            document.getElementById('modal-title-text').innerText = t; 
            document.getElementById('modal-msg').innerText = m; 
            if(showInput) {
                document.getElementById('admin-reply-input').style.display = 'block';
            }
            pending = f; 
            document.getElementById('confirm-modal').style.display = 'flex'; 
        };
        
        document.getElementById('btn-confirm').onclick = async () => { if(pending) await pending(); closeConfirm(); };

        // جلب الطلبات
        onSnapshot(collection(db, "orders"), (snap) => {
            const container = document.getElementById('orders-container'); 
            container.innerHTML = ""; let data = []; 
            snap.forEach(d => { 
                const o = d.data(); 
                if(o.status !== "مكتمل" && o.status !== "مرفوض") data.push({id: d.id, ...o}); 
            });
            data.sort((a,b) => (b.date?.toMillis() || 0) - (a.date?.toMillis() || 0));
            
            if(data.length === 0) { container.innerHTML = "<p style='text-align:center; color: #7f8c8d; padding: 20px;'>لا توجد طلبات معلقة حالياً ☕</p>"; return; }

            data.forEach(o => {
                const isR = o.service === "تغذية المحفظة";
                const uidSafe = o.uid || ""; 
                container.innerHTML += `<div class="item-row" style="${isR ? 'border-right-color:#27ae60; background:#e8f8f5;' : ''}">
                    <div style="flex:1;">
                        <h4 style="margin:0; color:${isR ? '#27ae60' : '#11998e'};">${isR ? '💰' : '📱'} ${o.service} ${o.network ? '('+o.network+')' : ''}</h4>
                        <p style="margin:5px 0 0; font-size:14px;">الزبون: <b>${o.user}</b></p>
                        <p style="margin:5px 0 0; font-size:12px; color:#666;">البيانات: ${o.targetInfo}</p>
                        <p style="margin:5px 0 0; color:#e74c3c; font-size:15px;">المبلغ: <b>${Number(o.amount).toLocaleString()} ج.س</b></p>
                    </div>
                    <div style="display:flex; flex-direction:column; gap:8px; min-width: 130px;">
                        ${isR ? `<button class="btn btn-green" onclick="approveR('${o.id}', '${uidSafe}', ${o.amount})">✅ تأكيد وإضافة</button>` 
                             : `<button class="btn btn-blue" onclick="approveO('${o.id}', '${uidSafe}', ${o.amount})">✅ تنفيذ وخصم</button>`}
                        <button class="btn btn-red" onclick="reject('${o.id}')">❌ رفض الطلب</button>
                    </div>
                </div>`;
            });
        });

        // دالة تأكيد الرصيد (لا تحتاج إدخال كود)
        window.approveR = (orderId, uid, amount) => openConfirm("إضافة رصيد", "تأكيد إضافة "+Number(amount).toLocaleString()+" ج.س لحساب الزبون؟", false, async () => {
            if(!uid) return window.showToast("هذا الطلب قديم ولا يحتوي على رقم حساب", true);
            try {
                const userRef = doc(db, "users", uid);
                const userSnap = await getDoc(userRef);
                if(userSnap.exists()) {
                    await updateDoc(userRef, { balance: (Number(userSnap.data().balance)||0) + Number(amount) });
                    await updateDoc(doc(db, "orders", orderId), { status: "مكتمل", adminReply: "تم إضافة الرصيد للمحفظة" });
                    window.showToast("تم شحن رصيد الزبون بنجاح! 🚀");
                } else { window.showToast("حساب الزبون غير موجود!", true); }
            } catch(e) { window.showToast("حدث خطأ في الاتصال", true); }
        });

        // دالة تنفيذ الخدمات (تطلب إدخال كود البطاقة)
        window.approveO = (orderId, uid, amount) => openConfirm("تنفيذ خدمة", "سيتم خصم "+Number(amount).toLocaleString()+" من حساب الزبون. أدخل كود البطاقة أو رسالة التنفيذ للزبون:", true, async () => {
            if(!uid) return window.showToast("هذا الطلب قديم، لا يمكن خصم الرصيد تلقائياً", true);
            
            const replyText = document.getElementById('admin-reply-input').value; // أخذ النص اللي كتبه الإدمن
            if(!replyText) return window.showToast("يجب إدخال الكود أو رسالة للزبون!", true);

            try {
                const userRef = doc(db, "users", uid);
                const userSnap = await getDoc(userRef);
                if(userSnap.exists()) {
                    const bal = Number(userSnap.data().balance)||0;
                    if(bal >= Number(amount)) {
                        await updateDoc(userRef, { balance: bal - Number(amount) });
                        // إضافة رد الإدمن (الكود) للطلب عشان يظهر للزبون
                        await updateDoc(doc(db, "orders", orderId), { status: "مكتمل", adminReply: replyText });
                        window.showToast("تم الخصم وإنهاء الطلب! ✅");
                    } else { window.showToast("عذراً، رصيد الزبون لا يكفي!", true); }
                }
            } catch(e) { window.showToast("حدث خطأ في الاتصال", true); }
        });

        window.reject = (id) => openConfirm("رفض الطلب", "هل أنت متأكد من رفض هذا الطلب نهائياً؟", false, async () => {
            await updateDoc(doc(db, "orders", id), { status: "مرفوض", adminReply: "تم رفض الطلب، يرجى مراجعة البيانات." });
            window.showToast("تم رفض الطلب بنجاح.", true);
        });
    </script>
</body>
</html>
