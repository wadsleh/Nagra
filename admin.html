<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>لوحة الإدارة | نَقْرَة</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Tajawal', sans-serif; background: #0f2027; color: white; padding: 20px; direction: rtl; margin: 0; }
        .card { background: white; color: #2c3e50; padding: 25px; border-radius: 20px; margin-bottom: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .item-row { background: #f8f9fa; padding: 15px; border-radius: 15px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; border-right: 5px solid #11998e; flex-wrap: wrap; gap: 10px; border: 1px solid #eee; border-right-width: 5px; }
        .btn { padding: 10px 15px; border: none; border-radius: 10px; cursor: pointer; color: white; font-weight: bold; font-family: 'Tajawal'; transition: 0.3s; font-size: 14px; }
        .btn-green { background: #2ecc71; } .btn-blue { background: #3498db; } .btn-red { background: #e74c3c; } .btn-orange { background: #f39c12; }
        .btn:hover { opacity: 0.9; transform: translateY(-2px); box-shadow: 0 4px 10px rgba(0,0,0,0.15); }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); backdrop-filter: blur(5px); display: none; justify-content: center; align-items: center; z-index: 2000; }
        .modal-box { background: white; color: #2c3e50; padding: 30px 20px; border-radius: 25px; text-align: center; width: 85%; max-width: 320px; box-shadow: 0 20px 50px rgba(0,0,0,0.5); animation: popIn 0.3s ease-out; }
        @keyframes popIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        
        /* تنسيق حقول الإدخال */
        .admin-input { width: 100%; padding: 12px; margin-bottom: 10px; border: 2px solid #eee; border-radius: 10px; font-family: 'Tajawal'; box-sizing: border-box; transition: 0.3s; }
        .admin-input:focus { border-color: #3498db; outline: none; }
        .flex-row { display: flex; gap: 10px; }
        
        .toast { visibility: hidden; min-width: 250px; background: #11998e; color: white; text-align: center; border-radius: 50px; padding: 15px; position: fixed; z-index: 3000; left: 50%; bottom: 30px; transform: translateX(-50%); transition: 0.3s; font-weight: bold; box-shadow: 0 10px 20px rgba(0,0,0,0.2); }
        .toast.error { background: #e74c3c; } .toast.show { visibility: visible; bottom: 50px; }
        
        table { width: 100%; border-collapse: collapse; text-align: right; }
        th { background: #f1f2f6; padding: 12px; border-bottom: 2px solid #ddd; color: #2c3e50; }
        td { padding: 12px; border-bottom: 1px solid #eee; color: #34495e; font-size: 14px; }
        tr:hover { background: #f8f9fa; }
    </style>
</head>
<body id="admin-body" style="display: none;">
    <h1 style="text-align:center; color:#11998e; margin-top: 10px;">غرفة تحكم نَقْرَة ⚙️</h1>
    
    <div style="text-align: left; margin-bottom: 15px;">
        <button onclick="logoutAdmin()" class="btn btn-red">تسجيل خروج</button>
    </div>

    <div style="display: flex; gap: 15px; margin-bottom: 20px;">
        <div class="card" style="flex: 1; text-align: center; margin-bottom: 0; padding: 15px;">
            <h4 style="margin:0; color:#7f8c8d;">👥 إجمالي المستخدمين</h4>
            <h2 id="stats-users" style="margin:10px 0 0; color:#3498db;">0</h2>
        </div>
        <div class="card" style="flex: 1; text-align: center; margin-bottom: 0; padding: 15px;">
            <h4 style="margin:0; color:#7f8c8d;">📦 طلبات بانتظار التنفيذ</h4>
            <h2 id="stats-orders" style="margin:10px 0 0; color:#e74c3c;">0</h2>
        </div>
    </div>

    <div class="card">
        <h3 style="border-bottom: 2px solid #eee; padding-bottom: 15px; margin-top: 0;">📦 الطلبات الواردة</h3>
        <div id="orders-container"><p style="text-align:center; color: #7f8c8d;">جاري جلب الطلبات... ⏳</p></div>
    </div>

    <div class="card">
        <h3 style="border-bottom: 2px solid #eee; padding-bottom: 15px; margin-top: 0;">👥 المستخدمين المسجلين</h3>
        <div style="overflow-x: auto;">
            <table>
                <thead>
                    <tr>
                        <th>الاسم</th>
                        <th>الإيميل</th>
                        <th>الرصيد الحالي</th>
                        <th>إجراءات</th>
                    </tr>
                </thead>
                <tbody id="users-table-body">
                    <tr><td colspan="4" style="text-align:center; color:#7f8c8d;">جاري جلب المستخدمين... ⏳</td></tr>
                </tbody>
            </table>
        </div>
    </div>

    <div id="confirm-modal" class="modal-overlay">
        <div class="modal-box">
            <h3 id="modal-title-text" style="margin: 0 0 10px; color: #2c3e50;">تأكيد</h3>
            <p id="modal-msg" style="color: #7f8c8d; font-size: 14px; margin-bottom: 15px;"></p>
            
            <div id="normal-reply" style="display:none;">
                <input type="text" id="admin-reply-input" class="admin-input" placeholder="أدخل كود الخدمة أو الرد للزبون...">
            </div>

            <div id="card-reply" style="display:none; text-align:right;">
                <input type="text" id="c-num" class="admin-input" placeholder="رقم البطاقة (16 رقم)">
                <div class="flex-row">
                    <input type="text" id="c-exp" class="admin-input" style="flex:1;" placeholder="التاريخ (MM/YY)">
                    <input type="text" id="c-cvv" class="admin-input" style="flex:1;" placeholder="CVV">
                </div>
                <input type="text" id="c-zip" class="admin-input" placeholder="الرمز البريدي (Zip Code)">
                <input type="text" id="c-address" class="admin-input" placeholder="عنوان الشحن (Billing Address)">
            </div>

            <div style="display: flex; gap: 10px; margin-top: 10px;">
                <button id="btn-confirm" class="btn btn-green" style="flex:1; padding: 12px; font-size: 15px;">نعم، تأكيد</button>
                <button onclick="closeConfirm()" class="btn" style="flex:1; background: #f1f2f6; color: #576574; padding: 12px; font-size: 15px;">إلغاء</button>
            </div>
        </div>
    </div>

    <div id="toast-message" class="toast"></div>

    <script type="module">
        // 🌟 إضافة addDoc و serverTimestamp للاستيراد
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getFirestore, collection, onSnapshot, doc, updateDoc, getDoc, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-firestore.js";
        import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-auth.js";
        
        const firebaseConfig = { apiKey: "AIzaSyB_8sjnJNMpUi0LAQv7U5lFmMvRlh5x0nU", authDomain: "nagra-app.firebaseapp.com", projectId: "nagra-app", storageBucket: "nagra-app.firebasestorage.app", messagingSenderId: "29893867141", appId: "1:29893867141:web:e8b4e0a15d80898575dbec" };
        const app = initializeApp(firebaseConfig); 
        const db = getFirestore(app);
        const auth = getAuth(app);

        // ⚠️ اكتب إيميلك هنا بالضبط
        const ADMIN_EMAIL = "wadsalihhamed@gmail.com"; 

        onAuthStateChanged(auth, (user) => {
            if (user && user.email === ADMIN_EMAIL) {
                document.getElementById('admin-body').style.display = 'block'; 
            } else {
                document.body.innerHTML = "<h2 style='color:#e74c3c; text-align:center; margin-top:50px;'>⛔ غير مصرح لك بالدخول. جاري التحويل...</h2>";
                document.body.style.display = 'block';
                setTimeout(() => { window.location.href = "index.html"; }, 2000);
            }
        });

        window.logoutAdmin = async () => { await signOut(auth); window.location.href = "index.html"; };

        window.showToast = (msg, isError = false) => { 
            const t = document.getElementById('toast-message'); t.innerText = msg; 
            t.className = isError ? "toast error show" : "toast show"; 
            setTimeout(() => t.className = "toast", 3000); 
        };
        
        let pending = null; 
        
        window.closeConfirm = () => {
            document.getElementById('confirm-modal').style.display = 'none'; 
            document.getElementById('normal-reply').style.display = 'none';
            document.getElementById('card-reply').style.display = 'none';
            document.getElementById('admin-reply-input').value = '';
            document.getElementById('c-num').value = ''; document.getElementById('c-exp').value = '';
            document.getElementById('c-cvv').value = ''; document.getElementById('c-zip').value = '';
            document.getElementById('c-address').value = '';
        };

        window.openConfirm = (t, m, showInput, f, serviceType = '') => { 
            document.getElementById('modal-title-text').innerText = t; 
            document.getElementById('modal-msg').innerText = m; 
            document.getElementById('normal-reply').style.display = 'none';
            document.getElementById('card-reply').style.display = 'none';

            if(showInput) {
                if(serviceType === 'بطاقات دفع') {
                    document.getElementById('card-reply').style.display = 'flex';
                    document.getElementById('card-reply').style.flexDirection = 'column';
                } else {
                    document.getElementById('normal-reply').style.display = 'block';
                }
            }
            
            window.currentConfirmService = serviceType; 
            pending = f; 
            document.getElementById('confirm-modal').style.display = 'flex'; 
        };
        
        document.getElementById('btn-confirm').onclick = async () => { if(pending) await pending(); closeConfirm(); };

        // جلب الطلبات
        onSnapshot(collection(db, "orders"), (snap) => {
            const container = document.getElementById('orders-container'); 
            container.innerHTML = ""; let data = []; 
            snap.forEach(d => { 
                const o = d.data(); 
                if(o.status !== "مكتمل" && o.status !== "مرفوض") data.push({id: d.id, ...o}); 
            });
            data.sort((a,b) => (b.date?.toMillis() || 0) - (a.date?.toMillis() || 0));
            
            document.getElementById('stats-orders').innerText = data.length;

            if(data.length === 0) { container.innerHTML = "<p style='text-align:center; color: #7f8c8d; padding: 20px;'>لا توجد طلبات معلقة حالياً ☕</p>"; return; }

            data.forEach(o => {
                const isR = o.service === "تغذية المحفظة";
                const uidSafe = o.uid || ""; 
                container.innerHTML += `<div class="item-row" style="${isR ? 'border-right-color:#27ae60; background:#e8f8f5;' : ''}">
                    <div style="flex:1;">
                        <h4 style="margin:0; color:${isR ? '#27ae60' : '#11998e'};">${isR ? '💰' : '📱'} ${o.service} ${o.network ? '('+o.network+')' : ''}</h4>
                        <p style="margin:5px 0 0; font-size:14px;">الزبون: <b>${o.user}</b></p>
                        <p style="margin:5px 0 0; font-size:12px; color:#666;">البيانات: ${o.targetInfo}</p>
                        <p style="margin:5px 0 0; color:#e74c3c; font-size:15px;">المبلغ: <b>${Number(o.amount).toLocaleString()} ج.س</b></p>
                    </div>
                    <div style="display:flex; flex-direction:column; gap:8px; min-width: 130px;">
                        ${isR ? `<button class="btn btn-green" onclick="approveR('${o.id}', '${uidSafe}', ${o.amount})">✅ تأكيد وإضافة</button>` 
                             : `<button class="btn btn-blue" onclick="approveO('${o.id}', '${uidSafe}', ${o.amount}, '${o.service}')">✅ تنفيذ وخصم</button>`}
                        <button class="btn btn-red" onclick="reject('${o.id}')">❌ رفض الطلب</button>
                    </div>
                </div>`;
            });
        });

        // جلب المستخدمين
        onSnapshot(collection(db, "users"), (snap) => {
            const tbody = document.getElementById('users-table-body');
            tbody.innerHTML = "";
            let usersCount = 0;

            snap.forEach(d => {
                usersCount++;
                const u = d.data();
                const isBanned = u.isBanned === true;
                const banBtnText = isBanned ? '✅ فك الحظر' : '⛔ حظر';
                const banBtnColor = isBanned ? 'btn-green' : 'btn-red';
                const rowOpacity = isBanned ? '0.5' : '1';

                tbody.innerHTML += `
                    <tr style="opacity: ${rowOpacity};">
                        <td style="font-weight: bold;">${u.name || 'بدون اسم'} ${isBanned ? '<span style="color:#e74c3c; font-size:11px;">(محظور)</span>' : ''}</td>
                        <td style="color: #7f8c8d;">${u.email}</td>
                        <td style="color: #27ae60; font-weight: bold;">${(Number(u.balance)||0).toLocaleString()} ج.س</td>
                        <td style="display: flex; gap: 5px; justify-content: center;">
                            <button class="btn btn-orange" style="padding: 6px 10px; font-size: 12px;" onclick="editUserBalance('${d.id}', '${u.name}', ${u.balance || 0})">
                                ✏️ تعديل
                            </button>
                            <button class="btn ${banBtnColor}" style="padding: 6px 10px; font-size: 12px;" onclick="toggleBanUser('${d.id}', '${u.name}', ${isBanned})">
                                ${banBtnText}
                            </button>
                        </td>
                    </tr>
                `;
            });

            document.getElementById('stats-users').innerText = usersCount;

            if(usersCount === 0) {
                tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; color:#7f8c8d;">لا يوجد مستخدمين مسجلين حتى الآن.</td></tr>`;
            }
        });

        window.toggleBanUser = (uid, name, currentlyBanned) => {
            const action = currentlyBanned ? "فك حظر" : "حظر";
            if(confirm(`هل أنت متأكد أنك تريد ${action} الزبون: ${name}؟`)) {
                updateDoc(doc(db, "users", uid), { isBanned: !currentlyBanned })
                    .then(() => window.showToast(`تم ${action} الزبون بنجاح! ✅`))
                    .catch(e => window.showToast("حدث خطأ", true));
            }
        };

        window.editUserBalance = (uid, name, currentBalance) => {
            const newBalance = prompt(`تعديل رصيد الزبون: ${name}\nالرصيد الحالي: ${currentBalance} ج.س\n\nأدخل الرصيد الجديد:`, currentBalance);
            if(newBalance !== null && newBalance !== "") {
                const numBal = Number(newBalance);
                if(!isNaN(numBal)) {
                    updateDoc(doc(db, "users", uid), { balance: numBal }).then(() => window.showToast("تم التحديث! ✅"));
                }
            }
        };

        // ==========================================
        // 🛡️ 1. دالة إضافة الرصيد (مع نظام السجل)
        // ==========================================
        window.approveR = (orderId, uid, amount) => openConfirm("إضافة رصيد", "تأكيد إضافة "+Number(amount).toLocaleString()+" ج.س لحساب الزبون؟", false, async () => {
            if(!uid) return window.showToast("طلب قديم", true);
            
            const orderRef = doc(db, "orders", orderId);
            const orderSnap = await getDoc(orderRef);
            if(!orderSnap.exists()) return window.showToast("الطلب غير موجود!", true);
            
            const currentStatus = orderSnap.data().status;
            if(currentStatus !== "قيد المراجعة" && currentStatus !== "قيد التنفيذ") {
                return window.showToast("⚠️ عذراً، تم معالجة هذا الطلب مسبقاً!", true);
            }

            const userRef = doc(db, "users", uid);
            const userSnap = await getDoc(userRef);
            if(userSnap.exists()) {
                await updateDoc(userRef, { balance: (Number(userSnap.data().balance)||0) + Number(amount) });
                await updateDoc(orderRef, { status: "مكتمل", adminReply: "تم إضافة الرصيد للمحفظة بنجاح" });
                
                // 🌟 إضافة المعاملة في دفتر الأستاذ (Transaction Log)
                await addDoc(collection(db, "transactions"), {
                    userId: uid,
                    type: "credit",
                    amount: Number(amount),
                    source: "bank deposit",
                    orderId: orderId,
                    date: serverTimestamp()
                });

                window.showToast("تم الشحن! 🚀");
            }
        });

        // ==========================================
        // 🛡️ 2. دالة تنفيذ الخدمات والخصم (مع نظام السجل)
        // ==========================================
        window.approveO = (orderId, uid, amount, serviceType) => openConfirm("تنفيذ خدمة", "سيتم خصم "+Number(amount).toLocaleString()+" من الزبون. أدخل بيانات الخدمة:", true, async () => {
            if(!uid) return window.showToast("طلب قديم", true);
            
            const orderRef = doc(db, "orders", orderId);
            const orderSnap = await getDoc(orderRef);
            if(!orderSnap.exists()) return window.showToast("الطلب غير موجود!", true);
            
            const currentStatus = orderSnap.data().status;
            if(currentStatus !== "قيد المراجعة" && currentStatus !== "قيد التنفيذ") {
                return window.showToast("⚠️ عذراً، تم معالجة هذا الطلب مسبقاً!", true);
            }
            
            let finalReplyText = "";

            if(window.currentConfirmService === 'بطاقات دفع') {
                const cNum = document.getElementById('c-num').value;
                const cExp = document.getElementById('c-exp').value;
                const cCvv = document.getElementById('c-cvv').value;
                const cZip = document.getElementById('c-zip').value;
                const cAddr = document.getElementById('c-address').value;

                if(!cNum || !cExp || !cCvv) return window.showToast("يجب إدخال رقم البطاقة والتاريخ والـ CVV على الأقل!", true);

                finalReplyText = `<div style="text-align: right; line-height: 1.8; margin-top: 5px;">
                    <div style="background:#f1f2f6; padding:8px; border-radius:5px; margin-bottom:5px;">
                        <span style="color:#7f8c8d; font-size:11px;">💳 رقم البطاقة</span><br>
                        <span style="font-family:monospace; font-size:15px; color:#2c3e50; letter-spacing:2px; user-select:all;">${cNum}</span>
                    </div>
                    <div style="display:flex; gap:10px; margin-bottom:5px;">
                        <div style="background:#f1f2f6; padding:8px; border-radius:5px; flex:1;">
                            <span style="color:#7f8c8d; font-size:11px;">📅 التاريخ</span><br><b style="user-select:all;">${cExp}</b>
                        </div>
                        <div style="background:#f1f2f6; padding:8px; border-radius:5px; flex:1;">
                            <span style="color:#7f8c8d; font-size:11px;">🔒 CVV</span><br><b style="user-select:all;">${cCvv}</b>
                        </div>
                    </div>
                    <div style="background:#f1f2f6; padding:8px; border-radius:5px;">
                        <span style="color:#7f8c8d; font-size:11px;">📍 العنوان:</span> <b style="user-select:all;">${cAddr}</b> | <span style="color:#7f8c8d; font-size:11px;">الرمز البريدي:</span> <b style="user-select:all;">${cZip}</b>
                    </div>
                </div>`;
            } else {
                finalReplyText = document.getElementById('admin-reply-input').value;
                if(!finalReplyText) return window.showToast("يجب إدخال الكود للزبون!", true);
            }

            try {
                const userRef = doc(db, "users", uid);
                const userSnap = await getDoc(userRef);
                
                if(userSnap.exists()) {
                    const bal = Number(userSnap.data().balance)||0;
                    if(bal >= Number(amount)) {
                        await updateDoc(userRef, { balance: bal - Number(amount) });
                        await updateDoc(orderRef, { status: "مكتمل", adminReply: finalReplyText });
                        
                        // 🌟 إضافة المعاملة في دفتر الأستاذ (Transaction Log)
                        await addDoc(collection(db, "transactions"), {
                            userId: uid,
                            type: "debit",
                            amount: Number(amount),
                            source: serviceType,
                            orderId: orderId,
                            date: serverTimestamp()
                        });

                        window.showToast("تم الخصم وإنهاء الطلب! ✅");
                    } else { window.showToast("رصيد الزبون لا يكفي!", true); }
                } else {
                    window.showToast("حساب الزبون غير موجود في قاعدة البيانات!", true);
                }
            } catch(e) {
                window.showToast("حدث خطأ في الاتصال بقاعدة البيانات", true);
            }
        }, serviceType);

        // ==========================================
        // 🛡️ 3. دالة رفض الطلب (محمية ضد التكرار)
        // ==========================================
        window.reject = (id) => openConfirm("رفض الطلب", "هل أنت متأكد من رفض هذا الطلب نهائياً؟", false, async () => {
            const orderRef = doc(db, "orders", id);
            const orderSnap = await getDoc(orderRef);
            if(!orderSnap.exists()) return window.showToast("الطلب غير موجود!", true);
            
            const currentStatus = orderSnap.data().status;
            if(currentStatus !== "قيد المراجعة" && currentStatus !== "قيد التنفيذ") {
                return window.showToast("⚠️ عذراً، تم معالجة هذا الطلب مسبقاً!", true);
            }

            await updateDoc(orderRef, { status: "مرفوض", adminReply: "تم رفض الطلب، يرجى مراجعة البيانات أو التواصل مع الدعم." });
            window.showToast("تم رفض الطلب.", true);
        });
    </script>
</body>
</html>
